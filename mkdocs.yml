# Page checklist for site-app/assemble.js. The published site is site-app/.
site_name: XPerf
site_description: A lint hit means look here, not this will be faster.
site_url: https://lbb00.github.io/xperf/
repo_url: https://github.com/lbb00/xperf
repo_name: lbb00/xperf
edit_uri: edit/main/
docs_dir: site-src
site_dir: site
copyright: Copyright &copy; 2026 XPerf contributors

theme:
  name: material
  variant: classic
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Start:
      - Overview: docs/overview.md
      - Quick start: docs/quickstart.md
      - Kits: docs/kits.md
      - Smell catalog: docs/smell-catalog.md
      - Rule regression: docs/rule-regression.md
  - Languages:
