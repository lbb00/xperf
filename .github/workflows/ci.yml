name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    name: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package presence
        run: bash scripts/sync-check.sh
      - name: Privacy check (tree + history)
        run: bash scripts/privacy-check.sh --history
      - name: Docs (style + generated guides)
        run: |
          bash scripts/doc-check.sh
          bash scripts/build-guides.sh --check

  cperf:
    name: cperf (make test)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        working-directory: packages/cperf/cperf-lint
        run: make test

  jsperf:
    name: jsperf (npm test)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke + self-lint
        working-directory: packages/jsperf
        run: |
          npm test
          npm run self-lint

  zperf:
    name: zperf (zig build test)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.17
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Test
        working-directory: packages/zperf/zperf-lint
        run: zig build test

  jvmperf:
    name: jvmperf (gradle test)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test
        working-directory: packages/jvmperf/jvmperf-lint
        run: ./gradlew test --no-daemon

  goperf:
    name: goperf (smoke)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Smoke + go test
        working-directory: packages/goperf
        run: |
          bash scripts/smoke-lint.sh
          (cd goperf-lint && go test ./...)

  pyperf:
    name: pyperf (smoke)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke + self-lint
        working-directory: packages/pyperf
        run: |
          bash scripts/smoke-lint.sh
          bash scripts/self-lint.sh

  arktsperf:
    name: arktsperf (smoke)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke
        working-directory: packages/arktsperf
        run: bash scripts/smoke-lint.sh

  swiftperf:
    name: swiftperf (smoke, optional)
    runs-on: ubuntu-latest
    needs: sync-check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Smoke if Swift present
        working-directory: packages/swiftperf
        run: |
          if command -v swift >/dev/null 2>&1; then
            bash scripts/smoke-lint.sh
          else
            echo "Swift toolchain not on runner — skip (continue-on-error)"
            exit 0
          fi

  cppperf:
    name: cppperf (smoke)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++
      - name: Smoke + self-lint
        working-directory: packages/cppperf
        run: |
          bash scripts/smoke-lint.sh
          bash scripts/self-lint.sh

  phpperf:
    name: phpperf (smoke)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - name: Install php-cli
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
      - name: Smoke + self-lint
        working-directory: packages/phpperf
        run: |
          bash scripts/smoke-lint.sh
          bash scripts/self-lint.sh

  rubyperf:
    name: rubyperf (smoke)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - name: Install ruby
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ruby
      - name: Smoke + self-lint
        working-directory: packages/rubyperf
        run: |
          bash scripts/smoke-lint.sh
          bash scripts/self-lint.sh

  csharpperf:
    name: csharpperf (smoke, optional)
    runs-on: ubuntu-latest
    needs: sync-check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Smoke if dotnet present
        working-directory: packages/csharpperf
        run: |
          if command -v dotnet >/dev/null 2>&1; then
            bash scripts/smoke-lint.sh
          else
            echo "dotnet SDK not on runner — skip (continue-on-error)"
            exit 0
          fi

  rustperf:
    name: rustperf (smoke)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Smoke + self-lint
        working-directory: packages/rustperf
        run: |
          bash scripts/smoke-lint.sh
          bash scripts/self-lint.sh

  luaperf:
    name: luaperf (smoke)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - name: Install lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Smoke + self-lint
        working-directory: packages/luaperf
        run: |
          bash scripts/smoke-lint.sh
          bash scripts/self-lint.sh

  beamperf:
    name: beamperf (smoke)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - name: Install elixir
        run: sudo apt-get update -qq && sudo apt-get install -y -qq elixir
      - name: Smoke + self-lint
        working-directory: packages/beamperf
        run: |
          bash scripts/smoke-lint.sh
          bash scripts/self-lint.sh

  objcperf:
    name: objcperf (smoke)
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang
      - name: Smoke + self-lint
        working-directory: packages/objcperf
        run: |
          bash scripts/smoke-lint.sh
          bash scripts/self-lint.sh

  kotlinperf:
    name: kotlinperf (smoke, optional)
    runs-on: ubuntu-latest
    needs: sync-check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Smoke if kotlinc present
        working-directory: packages/kotlinperf
        run: |
          if command -v kotlinc >/dev/null 2>&1; then
            bash scripts/smoke-lint.sh
          else
            echo "kotlinc not on runner — skip (continue-on-error)"
            exit 0
          fi

  dartperf:
    name: dartperf (smoke, optional)
    runs-on: ubuntu-latest
    needs: sync-check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
        continue-on-error: true
      - name: Smoke if dart present
        working-directory: packages/dartperf
        run: |
          if command -v dart >/dev/null 2>&1; then
            bash scripts/smoke-lint.sh
          else
            echo "dart SDK not on runner — skip (continue-on-error)"
            exit 0
          fi

  nimperf:
    name: nimperf (smoke)
    runs-on: ubuntu-latest
    needs: sync-check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install nim (choosenim)
        run: |
          curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
      - name: Smoke + self-lint
        working-directory: packages/nimperf
        run: |
          bash scripts/smoke-lint.sh
          bash scripts/self-lint.sh
